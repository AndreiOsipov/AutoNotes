name: Python CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - README.md
      - .env.example
      - LICENSE
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lint and Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем зависимости. 
          # Добавляем --extra-index-url для torch, если он будет долго качаться, 
          # но для начала хватит и обычного requirements.
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        # Перечисляем все переменные из твоего env.example
        env:
          SECRET_KEY: "super-secret-test-key"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        # Добавь сюда остальные переменные, если они есть в env.example
        run: |
          PYTHONPATH=. python -m pytest
