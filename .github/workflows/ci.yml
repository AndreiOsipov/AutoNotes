# =============================================================================
# AutoNotes CI/CD Pipeline
# =============================================================================
# Job-ы (последовательность выполнения):
#   1. lint          — проверка форматирования и линтинг через ruff
#   2. test          — запуск тестов pytest с uv + подготовка JWT-ключей
#   3. docker-build  — сборка Docker-образа (выполняется после успешного test)
#   4. docker-push   — пуш образа в DockerHub (только при пуше из ветки main)
#
# Зависимости job: lint → test → docker-build → docker-push
# =============================================================================

name: Python CI/CD

# ---------------------------------------------------------------------------
# Триггеры запуска:
#   push     — на любые ветки, но игнорируя только документационные файлы
#   pull_request — только на main/master (для проверки PR)
#   workflow_dispatch — ручной запуск с параметром ветки для Docker-пуша
# ---------------------------------------------------------------------------
on:
  push:
    branches: ["**"]
    # Не запускать воркфлоу при изменениях ТОЛЬКО этих файлов
    paths-ignore:
      - README.md
      - README
      - .env.example
      - LICENSE
      - docs/**
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch-to-push:
        description: "Branch to build and push Docker image to DockerHub"
        required: false
        default: "main"
        type: string

# ---------------------------------------------------------------------------
# Глобальные переменные для всех job-ов
# ---------------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.12"
  DOCKER_REGISTRY: docker.io
  # Ветку для Docker-пуша можно переопределить через workflow_dispatch
  BRANCH_TO_PUSH: main

# =============================================================================
# Job 1: Linting & Formatting
# ---------------------------------------------------------------------------
# Проверяет код статическим анализатором ruff.
# Не зависит от других job — запускается первым.
# =============================================================================
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ruff check — линтинг (поиск ошибок и антипаттернов)
      - name: Run ruff check
        run: uvx ruff check .

      # ruff format --check — проверка форматирования без автоисправления
      - name: Run ruff format check
        run: uvx ruff format --check .


# =============================================================================
# Job 2: Tests
# ---------------------------------------------------------------------------
# Запускает pytest через uv. Зависит от lint (needs: [lint]).
# Перед тестами из GitHub Secrets загружаются JWT-ключи для аутентификации.
# =============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ------------------------------------------------------------------
      # Шаг 1: Настройка JWT-ключей из GitHub Secrets
      # Требуется для модулей аутентификации (core/security.py, core/tokens.py)
      # Secrets должны быть настроены в репозитории:
      #   - secrets.JWT_PRIVATE_KEY — содержимое private.pem
      #   - secrets.JWT_PUBLIC_KEY  — содержимое public.pem
      # ------------------------------------------------------------------
      - name: Setup JWT keys
        run: |
          mkdir -p certs
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > certs/private.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > certs/public.pem

      # ------------------------------------------------------------------
      # Шаг 2: Запуск тестов через uv
      # uv автоматически устанавливает зависимости из pyproject.toml,
      # включая dev-группу (pytest, pytest-asyncio, httpx и т.д.)
      # PYTHONPATH=. нужен для корректного импорта модулей из src/
      # ------------------------------------------------------------------
      - name: Run tests with pytest
        run: uv run pytest -v

      # ------------------------------------------------------------------
      # Шаг 3: Очистка секретных ключей (безопасность)
      # Удаляет файлы ключей после завершения тестов
      # ------------------------------------------------------------------
      - name: Clean up JWT keys
        if: always()
        run: |
          rm -rf certs


# =============================================================================
# Job 3: Docker Build
# ---------------------------------------------------------------------------
# Собирает Docker-образ и проверяет его работоспособность.
# Пуш в registry НЕ выполняется — это отдельный job (docker-push).
# Зависит от test (needs: [test]).
# =============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Генерация метаданных для Docker-образа (теги и лейблы)
      # Теги:
      #   - имя_ветки (например, main, feature/add-auth) — всегда
      #   - хэш коммита (например, abc1234) — всегда
      #   - latest — только для дефолтной ветки (main/master)
      # ------------------------------------------------------------------
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/autonotes
          tags: |
            type=raw,value=${{ github.ref_name }},enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # ------------------------------------------------------------------
      # Сборка Docker-образа без пуша (push: false)
      # load: true — загружает образ в локальный Docker daemon
      # Это позволяет проверить сборку и запустить образ локально
      # ------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ------------------------------------------------------------------
      # Проверка что образ запускается и зависимости установлены корректно
      # ------------------------------------------------------------------
      - name: Test Docker image
        run: |
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/autonotes:${{ github.sha }} uv pip list


# =============================================================================
# Job 4: Docker Push
# ---------------------------------------------------------------------------
# Пушит Docker-образ в DockerHub.
# Условие запуска:
#   - push event И ветка совпадает с BRANCH_TO_PUSH (по умолчанию main)
#   - ИЛИ ручной запуск (workflow_dispatch) с указанной веткой
# Зависит от docker-build (needs: [docker-build]).
# =============================================================================
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker-build]

    # Условие выполнения: пуш только из определённой ветки
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', env.BRANCH_TO_PUSH)) ||
      (github.event_name == 'workflow_dispatch')
    # workflow_dispatch не поддерживает github.ref, поэтому проверяем input

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Авторизация в DockerHub
      # Secrets: DOCKER_USERNAME — имя пользователя DockerHub
      #          DOCKER_PASSWORD — токен или пароль от DockerHub
      # ------------------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------------------
      # Генерация метаданных (те же теги, что и в docker-build)
      # ------------------------------------------------------------------
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/autonotes
          tags: |
            type=raw,value=${{ github.ref_name }},enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # ------------------------------------------------------------------
      # Сборка и пуш образа в DockerHub
      # platforms: linux/amd64,linux/arm64 — multi-platform build
      # ------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      # ------------------------------------------------------------------
      # Автоматическое создание Git-тега на основе хэша коммита
      # Формат тега: v<sha>-<date> (например, vabc1234-20260527)
      # Примечание: пуш тега закомментирован — раскомментируйте если нужен
      # ------------------------------------------------------------------
      - name: Create Git tag
        run: |
          TAG_NAME="v${{ github.sha }}-$(date +%Y%m%d)"
          git tag -a "$TAG_NAME" -m "Docker image ${{ github.sha }}" || echo "Tag may already exist, skipping push"
          # Для пуша тега нужен token с write-repo правами:
          # git push origin "$TAG_NAME" --tags