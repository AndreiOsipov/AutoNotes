name: Python CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - README.md
      - .env.example
      - LICENSE
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lint and Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --extra cpu --group dev

      - name: Run tests
        env:
          SECRET_KEY: "super-secret-test-key"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          PROJECT_NAME: "AutoNotes CI"
          PROJECT_DESCRIPTION: "CI test run"
          PROJECT_VERSION: "1.0.0"
          DB: "sqlite+aiosqlite:///./test.db"
          JWT_PRIVATE_KEY_PATH: "./certs/private.pem"
          JWT_PUBLIC_KEY_PATH: "./certs/public.pem"
          JWT_ALGORITHM: "RS256"
          ACCESS_TOKEN_EXPIRES_MINUTES: "15"
          REFRESH_TOKEN_EXPIRES_MINUTES: "43200"
          ACCESS_COOKIE_NAME: "access_token"
          REFRESH_COOKIE_NAME: "refresh_token"
          SESSION_COOKIE_SECURE: "false"
          SESSION_COOKIE_DOMAIN: ""
          JWT_ISSUER: "autonotes-ci"
          JWT_AUDIENCE: "autonotes-api"
        run: |
          uv run pytest
