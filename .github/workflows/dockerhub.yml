name: DockerHub

on:
  pull_request:
    branches: [production]
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'production' &&
      github.event.pull_request.head.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: version
        run: |
          git fetch --tags
          TAG=$(git tag --sort=-version:refname | head -1)
          echo "value=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TORCH_EXTRA=cpu
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autonotes:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/autonotes:latest
