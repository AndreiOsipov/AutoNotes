name: CD

on:
  push:
    branches: [production]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "value=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.value }}
          git push origin ${{ steps.version.outputs.value }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TORCH_EXTRA=cpu
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autonotes:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/autonotes:latest
