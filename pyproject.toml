[project]
name = "autonotes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "librosa>=0.11.0",
    "moviepy>=2.2.1",
    "opencv-python>=4.13.0.92",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.12.1",
    "python-multipart>=0.0.29",
    "sqlmodel>=0.0.38",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

# Группа библиотек для тестирования
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

# Настройка ruff
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

# Настройка тестов
[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
